
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matematik Macerası</title>
<style>
body{
font-family: Arial, sans-serif;
margin:0;
background: linear-gradient(135deg,#ff9ad5,#ffd6ec);
text-align:center;
}
header{
padding:20px;
font-size:28px;
font-weight:bold;
color:white;
}
#levels{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(80px,1fr));
gap:10px;
padding:20px;
}
.level{
background:white;
border-radius:12px;
padding:10px;
cursor:pointer;
box-shadow:0 3px 6px rgba(0,0,0,0.2);
transition:0.2s;
}
.level:hover{
transform:scale(1.05);
}
.stars{
color:gold;
font-size:14px;
}
#game{
display:none;
padding:20px;
}
.question{
font-size:40px;
margin:20px;
}
input{
font-size:24px;
padding:10px;
width:120px;
text-align:center;
}
button{
font-size:20px;
padding:10px 20px;
border:none;
border-radius:10px;
background:#ff5fa2;
color:white;
cursor:pointer;
margin-top:10px;
}
button:hover{
opacity:0.85;
}
#result{
font-size:22px;
margin-top:10px;
}
</style>
</head>

<body>

<header>🎮 Matematik Macerası</header>

<div id="levels"></div>

<div id="game">
<div id="levelTitle"></div>
<div class="question" id="question"></div>
<input id="answer" type="number"/>
<br>
<button onclick="check()">Cevapla</button>
<div id="result"></div>
<br>
<button onclick="back()">⬅ Bölümlere Dön</button>
</div>

<script>

const levelsDiv = document.getElementById("levels");
const questionEl = document.getElementById("question");
const resultEl = document.getElementById("result");
const answerInput = document.getElementById("answer");
const levelTitle = document.getElementById("levelTitle");

let currentAnswer = 0;
let currentLevel = 0;

function stars(n){
let s="";
for(let i=0;i<n;i++) s+="⭐";
return s;
}

function difficulty(level){
if(level<=40) return 1;
if(level<=80) return 2;
if(level<=120) return 3;
if(level<=160) return 4;
return 5;
}

for(let i=1;i<=200;i++){
let d=difficulty(i);
let div=document.createElement("div");
div.className="level";
div.innerHTML="<b>"+i+"</b><br><div class='stars'>"+stars(d)+"</div>";
div.onclick=()=>startLevel(i);
levelsDiv.appendChild(div);
}

function rand(seed,min,max){
let x=Math.sin(seed)*10000;
return Math.floor((x-Math.floor(x))*(max-min+1))+min;
}

function startLevel(level){
currentLevel=level;
levelsDiv.style.display="none";
document.getElementById("game").style.display="block";

let d=difficulty(level);

let a,b,op;

if(d==1){
a=rand(level,1,10);
b=rand(level+1,1,10);
op="+";
currentAnswer=a+b;
}

if(d==2){
a=rand(level,5,30);
b=rand(level+1,5,30);
op=Math.random()>0.5?"+":"-";
currentAnswer=op=="+"?a+b:a-b;
}

if(d==3){
a=rand(level,2,12);
b=rand(level+1,2,12);
op="×";
currentAnswer=a*b;
}

if(d==4){
a=rand(level,10,50);
b=rand(level+1,2,10);
op=Math.random()>0.5?"×":"-";
currentAnswer=op=="×"?a*b:a-b;
}

if(d==5){
b=rand(level+1,2,12);
currentAnswer=rand(level,2,12);
a=currentAnswer*b;
op="÷";
}

questionEl.innerHTML=a+" "+op+" "+b+" = ?";
levelTitle.innerHTML="Bölüm "+level+" | Zorluk: "+stars(d);
resultEl.innerHTML="";
answerInput.value="";
}

function check(){
let val=parseInt(answerInput.value);
if(val===currentAnswer){
resultEl.innerHTML="✅ Doğru!";
}else{
resultEl.innerHTML="❌ Yanlış. Doğru cevap: "+currentAnswer;
}
}

function back(){
document.getElementById("game").style.display="none";
levelsDiv.style.display="grid";
}

</script>

</body>
</html>
