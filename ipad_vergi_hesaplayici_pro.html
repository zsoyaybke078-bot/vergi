
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gelişmiş Vergi Hesaplayıcı</title>

<style>
body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;
background:linear-gradient(135deg,#ffc1dd,#ff7eb3);
margin:0;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
}

.app{
background:white;
width:420px;
max-width:92%;
border-radius:22px;
padding:28px;
box-shadow:0 20px 40px rgba(0,0,0,0.15);
}

h1{
margin-top:0;
text-align:center;
color:#ff2f8f;
}

input,select{
width:100%;
padding:12px;
margin-top:8px;
border-radius:12px;
border:1px solid #ddd;
font-size:16px;
box-sizing:border-box;
}

button{
width:100%;
padding:12px;
margin-top:12px;
border-radius:12px;
border:none;
background:#ff2f8f;
color:white;
font-size:16px;
cursor:pointer;
}

button:hover{
opacity:0.9;
}

.section{
margin-top:20px;
}

.result{
background:#fff3f8;
padding:15px;
border-radius:12px;
margin-top:15px;
}

.history{
max-height:180px;
overflow:auto;
margin-top:10px;
}

.history-item{
background:#fafafa;
padding:10px;
border-radius:10px;
margin-bottom:6px;
font-size:14px;
}

.small{
font-size:13px;
color:#666;
text-align:center;
margin-top:10px;
}
</style>
</head>

<body>

<div class="app">

<h1>Vergi Hesaplayıcı</h1>

<div class="section">
<b>Yeni Vergi Ekle</b>
<input id="taxName" placeholder="Vergi adı (KDV vb)">
<input id="taxPercent" type="number" placeholder="Yüzde (%)">
<button onclick="addTax()">Vergi Kaydet</button>
</div>

<div class="section">
<b>Vergi Hesapla</b>
<select id="taxSelect"></select>
<input id="amount" type="number" placeholder="Miktar">
<button onclick="calculate()">Hesapla</button>

<div class="result">
Vergi: <b id="taxResult">0</b><br>
Toplam: <b id="totalResult">0</b>
</div>
</div>

<div class="section">
<b>Hesap Geçmişi</b>
<div class="history" id="history"></div>
<button onclick="clearHistory()">Geçmişi Temizle</button>
</div>

<div class="small">iPad uyumlu • Modern pembe tema</div>

</div>

<script>

let taxes = JSON.parse(localStorage.getItem("taxes") || "[]");
let history = JSON.parse(localStorage.getItem("history") || "[]");

function saveData(){
localStorage.setItem("taxes",JSON.stringify(taxes));
localStorage.setItem("history",JSON.stringify(history));
}

function refreshTaxes(){

let select=document.getElementById("taxSelect");
select.innerHTML="";

taxes.forEach((t,i)=>{

let option=document.createElement("option");
option.value=i;
option.text=t.name+" ("+t.percent+"%)";

select.appendChild(option);

});

}

function addTax(){

let name=document.getElementById("taxName").value;
let percent=document.getElementById("taxPercent").value;

if(!name||!percent){
alert("Vergi adı ve yüzde gir");
return;
}

taxes.push({name,percent});

saveData();
refreshTaxes();

document.getElementById("taxName").value="";
document.getElementById("taxPercent").value="";
}

function calculate(){

let amount=document.getElementById("amount").value;
let tax=taxes[document.getElementById("taxSelect").value];

if(!tax){
alert("Vergi seç");
return;
}

let taxAmount=amount*tax.percent/100;
let total=Number(amount)+taxAmount;

document.getElementById("taxResult").innerText=taxAmount.toFixed(2);
document.getElementById("totalResult").innerText=total.toFixed(2);

history.unshift({
name:tax.name,
percent:tax.percent,
amount:amount,
taxAmount:taxAmount,
total:total
});

if(history.length>20)history.pop();

saveData();
refreshHistory();
}

function refreshHistory(){

let div=document.getElementById("history");
div.innerHTML="";

history.forEach(h=>{

let item=document.createElement("div");
item.className="history-item";

item.innerHTML=
h.amount+" + "+h.percent+"% "+h.name+
"<br>Vergi: "+h.taxAmount.toFixed(2)+
" • Toplam: "+h.total.toFixed(2);

div.appendChild(item);

});

}

function clearHistory(){

history=[];
saveData();
refreshHistory();

}

refreshTaxes();
refreshHistory();

</script>

</body>
</html>
